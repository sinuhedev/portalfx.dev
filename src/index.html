<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Portal FX.</title>
  <link rel="manifest" href="manifest.json">
  <link rel="shortcut icon" href="logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="stylesheet" href="theme/index.css" />
  <script type="module" src="main.js"></script>
</head>

<body>
  <article id="win-pause" class="show">
    <section>
      <button type="button" id="btn-continue" disabled>continue</button>
    </section>
  </article>

  <button type="button" id="btn-logo" class="hide">
    <svg aria-hidden="true" width='48' height='48' viewBox='0 0 48 48' fill='none' color='currentColor'
      stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>
      <g>
        <line x1="4.3" y1="11" x2="45" y2="24" id="line1" />
        <line x1="11" y1="24" x2="16" y2="24" id="line2" />
        <line x1="4.3" y1="38" x2="45" y2="24" id="line3" />
      </g>
    </svg>

  </button>

  <article id="win-log" class="show">
    <pre></pre>
  </article>

  <canvas style="height: 100% ; width: 100%"></canvas>
</body>

</html>
